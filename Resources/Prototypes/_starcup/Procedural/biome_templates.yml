- type: biomeTemplate
  id: Charonic
  layers:
    # tiles
    - !type:BiomeTileLayer
      threshold: -1.00
      tile: FloorPlanetDirtTwilight
    - !type:BiomeTileLayer
      threshold: -0.75
      tile: FloorPlanetGrassyDirtTwilight
      noise:
        seed: 0
        frequency: 0.03
        fractalType: None
    - !type:BiomeTileLayer
      threshold: -0.60
      tile: FloorPlanetGrassBlue
      noise:
        seed: 0
        frequency: 0.03
        fractalType: None
    # Sparse vegetation
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorPlanetGrassBlue
      divisions: 2
      threshold: 0.4
      invert: true
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      decals:
        - grasssnowa1
        - grasssnowa2
        - grasssnowa3
        - grasssnowb1
        - grasssnowb2
        - grasssnowb3
        - grasssnowc1
        - grasssnowc2
        - grasssnowc3
    # Dense, bland grass
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorPlanetGrassyDirtTwilight
        - FloorPlanetDirtTwilight
      divisions: 1
      threshold: -0.2
      noise:
        seed: 1
        noiseType: Cellular
        frequency: 0.4
        fractalType: FBm
        octaves: 5
        lacunarity: 2
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - grasssnow
        - grasssnow01
        - grasssnow02
        - grasssnow03
        - grasssnow04
        - grasssnow05
        - grasssnow06
        - grasssnow07
        - grasssnow08
        - grasssnow09
        - grasssnow10
        - grasssnow11
        - grasssnow12
        - grasssnow13
    # mushrooms
    - !type:BiomeDecalLayer
      allowedTiles:
        - FloorPlanetDirtTwilight
      threshold: -0.1
      noise:
        seed: 1
        noiseType: Cellular
        frequency: 0.4
        fractalType: FBm
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      decals:
        - Shrooma1
        - Shrooma2
        - Shrooma3
    # trees
    - !type:BiomeEntityLayer
      threshold: 0.45
      noise:
        seed: 0
        noiseType: OpenSimplex2
        fractalType: FBm
        frequency: 2
      allowedTiles:
        - FloorPlanetGrassBlue
      entities:
        - FloraTreeDead
        - FloraTreeTeal
        - ShadowTree
    # structures
    - !type:BiomeEntityLayer
      threshold: -0.05
      invert: true
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.006
        octaves: 1
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      allowedTiles:
        - FloorPlanetGrassBlue
        - FloorPlanetGrassyDirtTwilight
        - FloorPlanetDirtTwilight
      entities:
        - MaintsRoomMarker
    # rock formations
    - !type:BiomeEntityLayer
      allowedTiles:
        - FloorPlanetGrassBlue
        - FloorPlanetGrassyDirtTwilight
        - FloorPlanetDirtTwilight
      threshold: -0.15
      noise:
        seed: 0
        noiseType: Cellular
        frequency: 0.05
        lacunarity: 2.5
        fractalType: FBm
        octaves: 5
        cellularDistanceFunction: Euclidean
        cellularReturnType: Distance2
      entities:
        - WallRockChromite
    # mute toxin rivers
    - !type:BiomeEntityLayer
      allowedTiles:
        - FloorPlanetGrassBlue
        - FloorPlanetGrassyDirtTwilight
        - FloorPlanetDirtTwilight
      threshold: 0.925
      noise:
        seed: 3
        noiseType: OpenSimplex2
        frequency: 0.004
        lacunarity: 1.50
        fractalType: Ridged
        octaves: 1
      entities:
      - FloorMuteWaterEntity
    # mute toxin pools
    - !type:BiomeEntityLayer
      allowedTiles:
        - FloorPlanetDirtTwilight
      threshold: 0.75
      noise:
        frequency: 0.04
        fractalType: None
      entities:
      - FloorMuteWaterEntity
