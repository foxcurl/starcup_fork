- type: entity
  id: XenoVents
  parent: BaseGameRule
  components:
  - type: StationEvent
    startAnnouncement: station-event-xeno-vent-start-announcement
    startAudio:
      path: /Audio/Announcements/aliens.ogg
    earliestStart: 45
    minimumPlayers: 15 # starcup: 20 -> 15 to match most other hostile vent critters. hopefully being rare offsets the difficulty
    weight: 1
    duration: 30
  - type: VentCrittersRule
    table: !type:GroupSelector # DeltaV: EntityTable instead of spawn entries
      children:
      - id: MobXeno
        weight: 0.55
      - id: MobXenoRouny
        weight: 0.01
      - id: MobXenoDrone
        weight: 0.25
      - id: MobXenoSpitter
        weight: 0.05
      - id: MobXenoRunner
        weight: 0.08
      - id: MobXenoPraetorian
        weight: 0.03
      - id: MobXenoRavager
        weight: 0.02
      - id: MobXenoQueen
        weight: 0.01

- type: entity
  id: MothroachSpawn
  parent: BaseGameRule
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 5 # starcup: 15 -> 5
    weight: 4
    duration: 30
  - type: VentCrittersRule
    table: # DeltaV: EntityTable instead of spawn entries
      id: MobMothroach
